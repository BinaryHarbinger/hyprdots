# YellowDark Theme for Hyprland

# --- Color Variables ---
$accent      = rgba(FABD2FFF)        # main accent color
$accent_dim  = rgba(FABD2FBB)        # slightly transparent
$accent_fade = rgba(FABD2F88)        # faded accent
$bg_dark     = rgba(3C3836FF)           # main dark background
$bg_gray     = rgba(504945FF)           # gray box background
$shadow      = rgb(0,0,0)                # shadow color
$check       = rgba(40, 48, 65, 0.85)    # checkmark color
$fail        = rgb(204, 34, 34)          # fail color

general {

    col.active_border = rgba(FABD2FFF)      # main border colour
    col.inactive_border = rgba(D79921FF)    # alternate border colour

}

decoration {

    blur {
        enabled = true
        size = 15
        passes = 3
        vibrancy = 0.6
        vibrancy_darkness = 0.3 
    }

}

animations {
    enabled = true
}

