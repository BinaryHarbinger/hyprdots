# Minimal MPD config for user setup with paths relative to home (~)

# Music directory
music_directory    "~/Music"

# Playlist directory
playlist_directory "~/.config/mpd/playlists"

# Database and state files
db_file            "~/.config/mpd/database"
state_file         "~/.config/mpd/state"
log_file           "~/.config/mpd/log"

# No PID file for user service
pid_file           "/run/user/$(id -u)/mpd.pid"

# Audio output (Pipewire)
audio_output {
    type        "pulse"
    name        "PipeWire Pulse"
    mixer_type  "software"
}

# Local network only
bind_to_address    "127.0.0.1"
port               "6600"

# Unix socket for mpd-mpris
bind_to_address "/run/user/1000/mpd/socket"

# Logging level
log_level          "default"

