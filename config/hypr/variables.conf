$mainMod            = SUPER

$terminal           = foot
$editor             = foot -e --override=colors.alpha=1 nvim
$fileManager        = foot -e yazi
$musicPlayer        = foot -e rmpc
$menu               = pkill rofi || zsh -i -c 'rofi -show drun' 
$rmenu              = pkill rofi || zsh -ic '~/Dotfiles/bin/launchrofi -r'
$clipboard          = rofi -modi Clipboard:~/.config/hypr/scripts/clipboard.sh -show Clipboard -show-icons
$browser            = bash ~/Dotfiles/scripts/open-browser 
$loginManager       = hyprlock
$screenshot         = ~/Dotfiles/bin/launchrofi --screenshot_menu

