l
# HyprIdle configuration with media-aware timeouts

# -------------------------------
# Monitor backlight adjustments
# -------------------------------
listener {
    timeout = 150                                # 2.5 min
    on-timeout = sh -c 'if ! playerctl status 2>/dev/null | grep -q Playing; then brightnessctl -s set 10; fi'
    on-resume = brightnessctl -r                 # restore backlight
}

# -------------------------------
# Keyboard backlight adjustments
# -------------------------------
listener { 
    timeout = 150                                # 2.5 min
    on-timeout = sh -c 'if ! playerctl status 2>/dev/null | grep -q Playing; then brightnessctl -sd rgb:kbd_backlight set 0; fi'
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# -------------------------------
# Lock screen
# -------------------------------
listener {
    timeout = 300                                # 5 min
    on-timeout = sh -c 'if ! playerctl status 2>/dev/null | grep -q Playing; then hyprlock && rm -rf $HOME/.config/hypr/hyprlock/*; fi'
}

# -------------------------------
# DPMS / Screen off
# -------------------------------
listener {
    timeout = 330                                # 5.5 min
    on-timeout = sh -c 'if ! playerctl status 2>/dev/null | grep -q Playing; then hyprctl dispatch dpms off; fi'
    on-resume = hyprctl dispatch dpms on
}

# -------------------------------
# Suspend system
# -------------------------------
listener {
    timeout = 1800                               # 30 min
    on-timeout = sh -c 'if ! playerctl status 2>/dev/null | grep -q Playing; then systemctl suspend; fi'
}

